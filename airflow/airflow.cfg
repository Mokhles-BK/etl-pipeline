# Airflow configuration for the etl-pipeline.
# Generated scaffold — tune for your environment.

[core]
# Where DAGs live. The repo's dags/ dir is on PYTHONPATH via dags_folder.
dags_folder = /mnt/c/Users/mokhl/etl-pipeline/dags
executor = SequentialExecutor
parallels = 8
dag_concurrency = 16
plugins_are_loaded_before_migration = True

[logging]
base_log_folder = /mnt/c/Users/mokhl/etl-pipeline/airflow/logs
filename_template = {{ ti.dag_id }}-{{ ti.task_id }}-{{ execution_date }}.log

[webserver]
base_url = http://localhost:8080/

[scheduler]
dags_are_paused_at_creation = True

[database]
sql_alchemy_conn = sqlite:////mnt/c/Users/mokhl/etl-pipeline/airflow/airflow.db

# Postgres connection used by the DAG's PostgresHook.
# Format: postgres://USER:PASSWORD@HOST:PORT/DBNAME
[connections]
etl_db = postgres://etluser:devpass@172.20.227.53:5432/etl